name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:        # 支持手动触发，用于验证签名构建（不创建 Release）

permissions:
  contents: write           # 创建 Release 需要写权限

jobs:
  release:
    name: 签名构建 release APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v6

      - name: 安装 Android SDK 组件
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;35.0.0'

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/moyu-dango-release.jks
          {
            echo "storeFile=keystore/moyu-dango-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storeType=PKCS12"
          } > keystore/keystore.properties
          chmod 600 keystore/moyu-dango-release.jks keystore/keystore.properties

      - name: 构建签名 release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: 校验签名并输出证书指纹
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"
          test -f "$APK" || { echo "未找到 $APK"; exit 1; }
          "$BUILD_TOOLS/apksigner" verify --print-certs --verbose "$APK" \
            | grep -E "Verified using|Signer #1 certificate DN|Signer #1 certificate SHA-256"
          sha256sum "$APK"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，替换 APK 附件"
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            echo "创建 Release $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "摸鱼团子 ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi

      - name: 清理工作区中的签名密钥
        if: always()
        run: rm -rf keystore
